name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gitlab_tag:
        description: Tag of gitlab/gitlab-ce to patch
        default: nightly

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITLAB_TAG: ${{ inputs.gitlab_tag || 'nightly' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch of the fork
        run: |
          git fetch origin upstream-import
          bash container/make-patch.sh origin/upstream-import HEAD > container/fork.patch
          test -s container/fork.patch
          diffstat container/fork.patch 2>/dev/null || grep -c '^diff --git' container/fork.patch
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: container-gitlab-ce:test
          build-args: |
            GITLAB_TAG=${{ env.GITLAB_TAG }}
            IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the patched Ruby files
        run: |
          # GitLab is not started: the patched files only have to load and the glob logic to hold.
          files=$(grep '^+++ b/' container/fork.patch | cut -c7- | grep '\.rb$' || true)
          docker run --rm --entrypoint bash container-gitlab-ce:test -c "
            cd /opt/gitlab/embedded/service/gitlab-rails
            for f in $files; do /opt/gitlab/embedded/bin/ruby -wc \$f > /dev/null || exit 1; done
            /opt/gitlab/embedded/bin/ruby -e '
              module Gitlab; module Diff; end; end
              load \"lib/gitlab/diff/ui_ignore.rb\"
              u = Gitlab::Diff::UiIgnore.from_patterns([\"graphify-out/\", \"*.lock\", \"docs/**/*.md\"])
              abort \"ui_ignore broken\" unless u.ignored?(\"a/graphify-out/graph.json\") &&
                u.ignored?(\"yarn.lock\") && u.ignored?(\"docs/a/b.md\") &&
                !u.ignored?(\"graphify-outer/x\") && !u.ignored?(\"app/x.rb\")
              puts \"ui_ignore ok\"'
            test -f app/services/ci/precommit/amend_commit_service.rb
            grep -q 'precommit: 20' app/models/concerns/enums/ci/pipeline.rb"
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            GITLAB_TAG=${{ env.GITLAB_TAG }}
            IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
