name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gitlab_tag:
        description: Tag of gitlab/gitlab-ce to patch
        default: 19.5.3-ce.0

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITLAB_TAG: ${{ inputs.gitlab_tag || '19.5.3-ce.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch of the fork
        run: |
          git fetch origin upstream-import
          bash container/make-patch.sh origin/upstream-import HEAD > container/fork.patch
          test -s container/fork.patch
          diffstat container/fork.patch 2>/dev/null || grep -c '^diff --git' container/fork.patch
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: container-gitlab-ce:test
          build-args: |
            GITLAB_TAG=${{ env.GITLAB_TAG }}
            IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the patched Ruby files
        run: |
          docker run --rm -v "$PWD/container:/check:ro" --entrypoint bash container-gitlab-ce:test /check/check.sh
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: container
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            GITLAB_TAG=${{ env.GITLAB_TAG }}
            IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
